<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kalkulator Peluang Ikan</title>
    <style>
        body {
            font-family: Arial;
            background: #0f172a;
            margin: 0;
            padding: 20px;
            color: white;
        }
        .container {
            max-width: 480px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #60a5fa;
        }
        .hasil {
            margin-top: 20px;
            padding: 15px;
            background: #0f172a;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Peluang Ikan 🎣</h2>

    <label>Jumlah Rare</label>
    <input type="number" id="rare" placeholder="contoh: 100">

    <label>Jumlah Epic</label>
    <input type="number" id="epic" placeholder="contoh: 50">

    <label>Jumlah Legend</label>
    <input type="number" id="legend" placeholder="contoh: 20">

    <label>Jumlah Mitos</label>
    <input type="number" id="mitos" placeholder="contoh: 5">

    <label>Jumlah Secret</label>
    <input type="number" id="secret" placeholder="contoh: 1">

    <button onclick="hitung()">Hitung Peluang</button>

    <div class="hasil" id="hasil"></div>
</div>

<script>
function hitung() {
    let rare = parseInt(document.getElementById("rare").value) || 0;
    let epic = parseInt(document.getElementById("epic").value) || 0;
    let legend = parseInt(document.getElementById("legend").value) || 0;
    let mitos = parseInt(document.getElementById("mitos").value) || 0;
    let secret = parseInt(document.getElementById("secret").value) || 0;

    let total = rare + epic + legend + mitos + secret;

    if (total === 0) {
        document.getElementById("hasil").innerHTML = "Masukkan jumlah ikan dulu.";
        return;
    }

    function persen(x) {
        return ((x / total) * 100).toFixed(2);
    }

    document.getElementById("hasil").innerHTML = `
        <h3>Hasil Perhitungan:</h3>
        Total ikan: ${total}<br><br>
        Rare: ${persen(rare)}%<br>
        Epic: ${persen(epic)}%<br>
        Legend: ${persen(legend)}%<br>
        Mitos: ${persen(mitos)}%<br>
        Secret: <b>${persen(secret)}%</b><br><br>
        <b>Peluang dapat Secret: ${persen(secret)}%</b>
    `;
}
</script>

</body>
</html>
